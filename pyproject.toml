[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazon-ads-mcp"
version = "0.1.0"
description = "Self-hosted MCP server for the Amazon Ads API: Sponsored Products, Sponsored Brands, Sponsored Display, reporting and portfolios, with dry-run, read-only mode, confirm guards and an audit log."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Shopping Feeds" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "amazon-ads",
    "amazon-advertising",
    "amazon-ads-api",
    "sponsored-products",
    "sponsored-brands",
    "sponsored-display",
    "ppc",
    "ecommerce",
    "claude",
    "claude-desktop",
    "llm-tools",
    "agent-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/AI-Shopping-Feeds/amazon-ads-mcp"
Repository = "https://github.com/AI-Shopping-Feeds/amazon-ads-mcp"
Changelog = "https://github.com/AI-Shopping-Feeds/amazon-ads-mcp/blob/main/CHANGELOG.md"

[project.scripts]
amazon-ads-mcp = "amazon_ads_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_ads_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
